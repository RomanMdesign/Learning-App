<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aklat at Brochure: May-Akda at Bukabolaryo</title>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --text-color: #2b2b2b;
      --primary-color: #3e2723;
      --border-color: #d7ccc8;
      --highlight-color: #d84315;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }

    body.theme-science { --primary-color: #1b5e20; --highlight-color: #2e7d32; }
    body.theme-math { --primary-color: #0d47a1; --highlight-color: #1565c0; }
    body.theme-filipino { --primary-color: #bf360c; --highlight-color: #d84315; }
    body.theme-research { --primary-color: #4a148c; --highlight-color: #6a1b9a; }
    body.theme-humanities { --primary-color: #880e4f; --highlight-color: #ad1457; }
    body.theme-accountancy { --primary-color: #004d40; --highlight-color: #00695c; }
    body.theme-history { --primary-color: #e65100; --highlight-color: #f57c00; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.7;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
    }

    h1 { margin-bottom: 5px; color: var(--primary-color); font-size: 2.2rem; }
    .subtitle { font-style: italic; color: #555; }

    .mode-switch-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background: #fff;
      color: var(--primary-color);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .mode-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    .sector-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sector-btn {
      padding: 8px 16px;
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      background-color: #fff;
      color: var(--primary-color);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .sector-btn.active, .sector-btn:hover {
      background-color: var(--primary-color);
      color: #fff;
    }

    .controls-panel {
      display: flex;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
    }

    .search-bar {
      padding: 10px 15px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }

    .book-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--primary-color);
      padding: 25px;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .author-profile {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .author-portrait {
      width: 130px;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .author-details { flex-grow: 1; }
    .author-name { font-size: 1.6rem; color: var(--primary-color); margin: 0 0 5px 0; font-weight: bold; }

    .highlight-work {
      background-color: #fff3e0;
      color: var(--highlight-color);
      font-weight: bold;
      font-size: 1.1rem;
      padding: 4px 10px;
      border-radius: 4px;
      border-left: 4px solid var(--highlight-color);
      display: inline-block;
      margin: 8px 0;
    }

    .word-title { font-size: 1.6rem; color: var(--primary-color); margin: 0 0 10px 0; font-weight: bold; }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
    }

    .page-btn {
      padding: 8px 16px;
      border: 1px solid var(--primary-color);
      background: #fff;
      color: var(--primary-color);
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body class="theme-accountancy">

  <header>
    <h1>📖 Sistema ng Hiwalay na Brochure</h1>
    <p class="subtitle">Pumili sa pagitan ng Brochure ng mga May-akda o Brochure ng mga Bokabularyo sa bawat Asignatura.</p>
  </header>

  <div class="mode-switch-container">
    <button class="mode-btn" id="btn-mode-authors" onclick="switchMode('authors')">👤 Brochure ng mga May-Akda at Bayani</button>
    <button class="mode-btn active" id="btn-mode-vocab" onclick="switchMode('vocab')">📚 Brochure ng mga Bukabolaryo at Salita</button>
  </div>

  <div class="sector-nav">
    <button class="sector-btn active" onclick="switchSector('accountancy')">📈 Accountancy</button>
    <button class="sector-btn" onclick="switchSector('science')">🔬 Science</button>
    <button class="sector-btn" onclick="switchSector('math')">📐 Mathematics</button>
    <button class="sector-btn" onclick="switchSector('research')">📊 Research</button>
    <button class="sector-btn" onclick="switchSector('filipino')">✍️ Filipino</button>
    <button class="sector-btn" onclick="switchSector('humanities')">🎨 Humanities</button>
    <button class="sector-btn" onclick="switchSector('history')">📜 History</button>
  </div>

  <div class="controls-panel">
    <input type="text" id="search-input" class="search-bar" placeholder="Maghanap..." oninput="filterData()">
  </div>

  <div id="display-view" class="book-container"></div>

  <div class="pagination-container">
    <button class="page-btn" id="prev-page" onclick="changePage(-1)">Previous Page</button>
    <span id="page-info">Pahina 1</span>
    <button class="page-btn" id="next-page" onclick="changePage(1)">Next Page</button>
  </div>

  <script>
    const realAuthorImages = {
      "Albert Einstein": "https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg",
      "Isaac Newton": "https://upload.wikimedia.org/wikipedia/commons/3/39/GodfreyKneller-IsaacNewton-1689.jpg",
      "Marie Curie": "https://upload.wikimedia.org/wikipedia/commons/c/c8/Marie_Curie_c._1920s.jpg",
      "Pythagoras": "https://upload.wikimedia.org/wikipedia/commons/1/1a/Kapital_Pythagoras_Louvre_G163.jpg",
      "Euclid": "https://upload.wikimedia.org/wikipedia/commons/3/30/Euklid-von-Alexandria_1.jpg",
      "Jose Rizal": "https://upload.wikimedia.org/wikipedia/commons/b/b0/Jose_Rizal_full_length.jpg",
      "Andres Bonifacio": "https://upload.wikimedia.org/wikipedia/commons/2/23/Andres_Bonifacio_studio_portrait.jpg",
      "Apolinario Mabini": "https://upload.wikimedia.org/wikipedia/commons/4/4e/Apolinario_Mabini_seated.jpg",
      "Lope K. Santos": "https://upload.wikimedia.org/wikipedia/commons/e/e0/Lope_K._Santos.jpg",
      "Karl Popper": "https://upload.wikimedia.org/wikipedia/commons/4/43/Karl_Popper.jpg",
      "John Locke": "https://upload.wikimedia.org/wikipedia/commons/b/b8/John_Locke_by_Herman_Verelst.jpg",
      "Luca Pacioli": "https://upload.wikimedia.org/wikipedia/commons/2/2a/Ritratto_di_Luca_Pacioli.jpg"
    };

    const authorsDatabase = {
      accountancy: [
        { name: "Luca Pacioli", role: "Ama ng Accountancy", bio: "Isang Italyanong Franciscan friar at matematiko na nagdokumento sa kauna-unahang organisadong sistema ng bookkeeping sa daigdig.", contribution: "Double-Entry Bookkeeping System (Summa de Arithmetica, 1494)" }
      ],
      science: [
        { name: "Albert Einstein", role: "Theoretical Physicist", bio: "Siyentipikong nagpabago sa larangan ng pisika sa pamamagitan ng kaniyang teorya ng relatibidad.", contribution: "Theory of Relativity (E=mc²) at Photoelectric Effect" },
        { name: "Isaac Newton", role: "Mathematician at Physicist", bio: "Nagtatag ng mga batayang batas ng pisika at pormulasyon ng grabidad.", contribution: "Laws of Motion at Law of Universal Gravitation" }
      ],
      math: [
        { name: "Pythagoras", role: "Sinaunang Matematiko", bio: "Griyegong pilosopo na nagtatag ng mga tuntunin sa heometriya.", contribution: "Pythagorean Theorem ($a^2 + b^2 = c^2$)" }
      ],
      research: [
        { name: "Karl Popper", role: "Pilosopo ng Agham", bio: "Nagbigay ng pamantayan ng siyentipikong empirikong pananaliksik.", contribution: "Falsifiability Criterion" }
      ],
      filipino: [
        { name: "Lope K. Santos", role: "Ama ng Balarila", bio: "Makata at dalubwika na bumuo ng kauna-unahang pormal na gramatikang Tagalog.", contribution: "Balarila ng Wikang Pambansa at Abakada" }
      ],
      humanities: [
        { name: "John Locke", role: "Pilosopo", bio: "Ama ng Liberalismo at nagtatag ng teorya ng pantay na karapatan.", contribution: "Social Contract Theory at Natural Rights" }
      ],
      history: [
        { name: "Andres Bonifacio", role: "Supremo ng Katipunan", bio: "Pinuno ng rebolusyong Pilipino laban sa pananakop ng Espanya.", contribution: "Pagtatag ng KKK at Pagsulat ng Kartilya" }
      ]
    };

    // MGA TERMINOLOHIYA SA ACCOUNTING
    const vocabularyDatabase = {
      accountancy: [
        { word: "Pagtutuos (Accountancy / Accounting)", def: "Ang sining ng pagtatala, pag-uuri, at pagbubuod sa paraang may kabuluhan at sa halaga ng salapi, ng mga transaksyon at kaganapan na may katangiang pinansyal.", usage: "Pangunahing disiplina at kurso sa negosyo." },
        { word: "Akwenta / Kuwenta (Account)", def: "Isang pormal na talaan ng mga transaksyong pinansyal na may kaugnayan sa isang partikular na asset, liability, equity, kita, o gastusin.", usage: "Inilalagay sa General Ledger." },
        { word: "Tasa / Pagtatasa (Assessment / Valuation)", def: "Ang proseso ng pagtatakda ng halagang pinansyal o kaukulang halaga ng isang ari-arian o pananagutan.", usage: "Ginagamit sa pagtutuos ng buwis at audit." },
        { word: "Puhunan (Capital / Equity)", def: "Ang kabuuang halaga ng salapi o ari-arian na inilagay ng may-ari sa negosyo.", usage: "Makikita sa Statement of Changes in Equity." },
        { word: "Ari-arian (Assets)", def: "Lahat ng pangkabuhayang kayamanan o resources na pagmamay-ari ng isang kumpanya o indibidwal.", usage: "Bahagi ng Accounting Equation (Assets = Liabilities + Equity)." },
        { word: "Pinagkakautangan (Creditor)", def: "Isang tao, bangko, o institusyon kung kanino may utang na salapi o serbisyo ang negosyo.", usage: "Pinagmumulan ng Accounts Payable." },
        { word: "Nagkakautang (Debtor)", def: "Isang tao o entidad na may umiiral na utang o obligasyong pinansyal sa negosyo.", usage: "Pinagmumulan ng Accounts Receivable." },
        { word: "Kagastusan (Expense)", def: "Ang halaga ng salapi na ginastos sa pagpapatakbo ng negosyo upang makalikha ng kita.", usage: "Binabawas sa Revenue upang makuha ang Net Income." },
        { word: "Pautang / Utang (Liability)", def: "Mga kasalukuyang obligasyong pinansyal ng kumpanya na nagmula sa mga nagdaang transaksyon.", usage: "Iniuulat sa Balance Sheet." },
        { word: "Talaarawan ng Pagtutuos (Journal)", def: "Ang aklat ng unang pagtatala kung saan kronolohikong isinusulat ang mga transaksyon.", usage: "Ginagamit sa pamamaraang Journalizing." },
        { word: "Audit (Pagsusuri ng Kuwenta)", def: "Opisyal na inspeksyon at beripikasyon sa mga rekord at laporan ng pinansyal ng isang organisasyon.", usage: "Ginagawa ng Certified Public Accountant (CPA)." },
        { word: "Cash Flow (Daloy ng Salapi)", def: "Ang kabuuang halaga ng salapi na pumasok at lumabas sa isang negosyo sa loob ng isang partikular na panahon.", usage: "Iniuulat sa Statement of Cash Flows." },
        { word: "Depreciation (Pagbaba ng Halaga)", def: "Ang paghahati o pagpataw ng halaga ng isang fixed asset habang ginagamit ito sa paglipas ng panahon.", usage: "Iniuulat bilang gastusin sa Income Statement." },
        { word: "Net Income (Netong Kita)", def: "Ang natirang kita matapos ibawas ang lahat ng gastusin, buwis, at cost of goods sold mula sa kabuuang benta.", usage: "Tinatawag ding Bottom Line sa Income Statement." }
      ],
      science: [
        { word: "Photosynthesis", def: "Proseso ng paggawa ng pagkain ng mga halaman gamit ang liwanag ng araw.", usage: "Aralin sa Biology." }
      ],
      math: [
        { word: "Polynomial", def: "Ekspresyong matematikal na binubuo ng mga variable at constant.", usage: "Aralin sa Algebra." }
      ],
      research: [
        { word: "Kwalitatibong Pananaliksik", def: "Pananaliksik na nakatuon sa malalim na pagsusuri ng karanasan at salaysay ng tao.", usage: "Aralin sa Research Method." }
      ],
      filipino: [
        { word: "Mapanuring Pagbasa", def: "Pagsusuri ng nilalaman, estruktura, at layunin ng may-akda sa isang teksto.", usage: "Aralin sa Filipino at Literasiya." }
      ],
      humanities: [
        { word: "Epistemolohiya", def: "Pilosopikong pag-aaral sa pinagmulan at hangganan ng kaalaman ng tao.", usage: "Aralin sa Pilosopiya." }
      ],
      history: [
        { word: "Soberanya (Sovereignty)", def: "Ang ganap at kapangyarihang magsarili ng isang bansa.", usage: "Aralin sa Kasaysayan at Politika." }
      ]
    };

    const fullAuthors = {};
    const fullVocab = {};

    Object.keys(authorsDatabase).forEach(sec => {
      fullAuthors[sec] = [...authorsDatabase[sec]];
      for (let i = fullAuthors[sec].length + 1; i <= 1000; i++) {
        fullAuthors[sec].push({
          name: `${sec.toUpperCase()} Author #${i}`,
          role: `Mananaliksik sa ${sec.toUpperCase()}`,
          bio: `Isang dalubhasa na nagsagawa ng masusing pag-aaral sa ilalim ng sektor ng ${sec.toUpperCase()}.`,
          contribution: `Teorya at Modyul #${i}`
        });
      }
    });

    Object.keys(vocabularyDatabase).forEach(sec => {
      fullVocab[sec] = [...vocabularyDatabase[sec]];
      for (let i = fullVocab[sec].length + 1; i <= 1000; i++) {
        fullVocab[sec].push({
          word: `${sec.toUpperCase()} Termino #${i}`,
          def: `Batayang akademikong depinisyon ng salita sa asignaturang ${sec.toUpperCase()}.`,
          usage: `Ginagamit sa Modyul #${i}.`
        });
      }
    });

    let currentMode = "vocab";
    let currentSector = "accountancy";
    let currentPage = 1;
    const itemsPerPage = 10;
    let filteredList = [];

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-authors').classList.toggle('active', mode === 'authors');
      document.getElementById('btn-mode-vocab').classList.toggle('active', mode === 'vocab');
      document.getElementById('search-input').value = "";
      currentPage = 1;
      filterData();
    }

    function switchSector(sector) {
      currentSector = sector;
      document.body.className = `theme-${sector}`;
      document.querySelectorAll('.sector-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('search-input').value = "";
      currentPage = 1;
      filterData();
    }

    function filterData() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      if (currentMode === 'authors') {
        filteredList = fullAuthors[currentSector].filter(item => 
          item.name.toLowerCase().includes(query) || 
          item.role.toLowerCase().includes(query) ||
          item.contribution.toLowerCase().includes(query)
        );
      } else {
        filteredList = fullVocab[currentSector].filter(item => 
          item.word.toLowerCase().includes(query) || 
          item.def.toLowerCase().includes(query)
        );
      }
      
      currentPage = 1;
      renderBrochure();
    }

    function renderBrochure() {
      const container = document.getElementById('display-view');
      container.innerHTML = "";

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedItems = filteredList.slice(start, end);

      if (currentMode === 'authors') {
        paginatedItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'book-card';

          let imgUrl = realAuthorImages[item.name];
          let imageHTML = imgUrl ? `<img src="${imgUrl}" alt="${item.name}" class="author-portrait">` : '';

          card.innerHTML = `
            <div class="author-profile">
              ${imageHTML}
              <div class="author-details">
                <h2 class="author-name">👤 ${item.name}</h2>
                <div style="font-style: italic; color: #555;">${item.role}</div>
                <p><strong>📖 Kaligiran ng Pagkatao / Talambuhay:</strong><br>${item.bio}</p>
                <div><strong>🏆 Naiambag na Teorya / Kabayanihan / Ginawa:</strong></div>
                <div class="highlight-work">${item.contribution}</div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        paginatedItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'book-card';

          card.innerHTML = `
            <h2 class="word-title">📌 Salita / Termino: ${item.word}</h2>
            <p><strong>📝 Batayang Depinisyon:</strong><br>${item.def}</p>
            <p><strong>📚 Gamit sa Asignatura / Konteksto:</strong><br>${item.usage}</p>
          `;
          container.appendChild(card);
        });
      }

      const totalPages = Math.ceil(filteredList.length / itemsPerPage) || 1;
      document.getElementById('page-info').innerText = `Pahina ${currentPage} ng ${totalPages}`;
      document.getElementById('prev-page').disabled = currentPage === 1;
      document.getElementById('next-page').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      currentPage += direction;
      renderBrochure();
      window.scrollTo({ top: 100, behavior: 'smooth' });
    }

    filterData();
  </script>
</body>
</html>
