<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic, Theories, Real Authors & Research Hub</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary-color: #2b5876;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    body.theme-science { --bg-color: #e8f5e9; --primary-color: #2e7d32; }
    body.theme-math { --bg-color: #e3f2fd; --primary-color: #1565c0; }
    body.theme-filipino { --bg-color: #fff8e1; --primary-color: #f57f17; }
    body.theme-research { --bg-color: #f3e5f5; --primary-color: #6a1b9a; }
    body.theme-humanities { --bg-color: #fbe9e7; --primary-color: #d84315; }
    body.theme-accountancy { --bg-color: #e0f2f1; --primary-color: #00695c; }
    body.theme-history { --bg-color: #fff3e0; --primary-color: #e65100; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: all 0.4s ease;
    }

    header { text-align: center; margin-bottom: 20px; }
    h1 { margin-bottom: 5px; color: var(--primary-color); }
    .stat-badge { font-weight: bold; background: var(--primary-color); color: #fff; padding: 4px 12px; border-radius: 15px; }

    .sector-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .sector-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 25px;
      background-color: #fff;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
    }

    .sector-btn:hover, .sector-btn.active {
      background-color: var(--primary-color);
      color: #fff;
      transform: translateY(-2px);
    }

    .bg-info-btn {
      display: block;
      margin: 0 auto 20px auto;
      padding: 8px 16px;
      background: #fff;
      border: 2px dashed var(--primary-color);
      color: var(--primary-color);
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 20px auto;
      gap: 10px;
    }

    .search-bar {
      padding: 10px 15px;
      width: 280px;
      border: 2px solid var(--primary-color);
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }

    .mode-btn {
      padding: 8px 16px;
      border: 2px solid var(--primary-color);
      background: transparent;
      color: var(--primary-color);
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .vocab-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      border-top: 5px solid var(--primary-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .vocab-card:hover { transform: translateY(-3px); }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: top;
      border-radius: 8px;
      margin-bottom: 12px;
      background-color: #e0e0e0;
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .word-title { font-size: 1.15rem; font-weight: bold; color: var(--primary-color); }

    .tag-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
    }

    .tag-proseso { background-color: #2980b9; }
    .tag-konsepto { background-color: #8e44ad; }
    .tag-elemento { background-color: #27ae60; }
    .tag-teorya { background-color: #d35400; }
    .tag-pinansyal { background-color: #16a085; }
    .tag-sukat { background-color: #c0392b; }

    .author-box {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      background: rgba(0,0,0,0.04);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 6px;
      display: inline-block;
    }

    .definition { font-size: 0.9rem; line-height: 1.4; margin-top: 8px; }
    .click-hint { font-size: 0.75rem; color: #888; margin-top: 8px; text-align: right; font-style: italic; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 1.5rem;
      border: none;
      background: none;
      cursor: pointer;
    }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
    }

    .page-btn {
      padding: 8px 14px;
      border: 1px solid var(--primary-color);
      background: #fff;
      color: var(--primary-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .quiz-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: none;
    }

    .quiz-option {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
    }

    .quiz-option:hover { background: #f0f0f0; }
    .score-box { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body class="theme-science">

  <header>
    <h1>Academic, Theories & Real Portrait Authors Hub</h1>
    <p>May kabuuang <span id="total-words-count" class="stat-badge">0</span> salita at <span id="total-authors-count" class="stat-badge">0</span> authors na may totoong larawan!</p>
  </header>

  <div class="sector-nav">
    <button class="sector-btn active" onclick="switchSector('science')">🔬 Science</button>
    <button class="sector-btn" onclick="switchSector('math')">📐 Mathematics</button>
    <button class="sector-btn" onclick="switchSector('filipino')">✍️ Filipino</button>
    <button class="sector-btn" onclick="switchSector('research')">📊 Research</button>
    <button class="sector-btn" onclick="switchSector('humanities')">🎨 Humanities</button>
    <button class="sector-btn" onclick="switchSector('accountancy')">📈 Accountancy & Business</button>
    <button class="sector-btn" onclick="switchSector('history')">📜 History & Heroes</button>
  </div>

  <button class="bg-info-btn" onclick="showSectorBackground()">📖 Basahin ang Background Study ng Sektor na Ito</button>

  <div class="controls-panel">
    <div>
      <button class="mode-btn active" id="btn-vocab" onclick="setMode('vocab')">📚 Vocabulary List</button>
      <button class="mode-btn" id="btn-quiz" onclick="setMode('quiz')">🧠 Quiz Mode</button>
    </div>
    <input type="text" id="search-input" class="search-bar" placeholder="Maghanap ng salita, teorya, o author..." oninput="filterWords()">
  </div>

  <div id="vocab-view" class="vocab-grid"></div>

  <div id="pagination-view" class="pagination-container">
    <button class="page-btn" id="prev-page" onclick="changePage(-1)">Pabalik</button>
    <span id="page-info">Pahina 1</span>
    <button class="page-btn" id="next-page" onclick="changePage(1)">Susunod</button>
  </div>

  <div id="quiz-view" class="quiz-container">
    <h2 id="quiz-question">Tanong...</h2>
    <div id="quiz-options"></div>
    <div id="quiz-feedback" class="score-box"></div>
  </div>

  <div id="info-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <h2 id="modal-title" style="color: var(--primary-color);">Background Study</h2>
      <hr>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const sectorBackgrounds = {
      science: "Ang Sektor ng Agham ay nakatuon sa empirikal na pag-aaral sa natural na daigdig. Mula sa Quantum Mechanics hanggang sa Evolution Theory, ang mga teoryang ito ang batayan ng modernong teknolohiya at medisina.",
      math: "Ang Sektor ng Matematika ay nagbibigay ng pormal na estruktura sa lohika at kalkulasyon. Ang mga prinsipyo nina Pythagoras, Newton, at Gauss ang bumubuo sa batayan ng engineering at physics.",
      filipino: "Ang Sektor ng Wikang Filipino at Literatura ay nakabase sa Maka-Pilipinong Pananaliksik at Balarila. Layunin nitong payabungin ang pambansang identidad gamit ang sariling wika.",
      research: "Ang Sektor ng Pananaliksik ay nakatuon sa metodolohiya, empirikal na validation, at teorya tulad ng Falsifiability ni Popper at Mixed Methods ni Creswell.",
      humanities: "Ang Sektor ng Humanidades at Pilosopiya ay nagsusuri sa kaisipan, etika, at diwa ng tao. Tinatalakay rito ang Social Contract at Sikolohiyang Pilipino.",
      accountancy: "Ang Sektor ng Accountancy at Pamamahala ay nakatuon sa alokasyon ng yaman, pamamahala sa tao, at auditing. Kasama rito ang Theory Z ni Ouchi at Scientific Management ni Taylor.",
      history: "Ang Sektor ng Kasaysayan at mga Bayani ay naglalahad ng pag-unlad ng lipunan sa paglipas ng panahon. Nakatuon ito sa nationalist historiography at pambansang kamalayan."
    };

    // Totoong Portrait Images mula sa Wikimedia Commons
    const realAuthorImages = {
      "Albert Einstein": "https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg",
      "Isaac Newton": "https://upload.wikimedia.org/wikipedia/commons/3/39/GodfreyKneller-IsaacNewton-1689.jpg",
      "Charles Darwin": "https://upload.wikimedia.org/wikipedia/commons/2/2e/Charles_Darwin_seated_crop.jpg",
      "Galileo Galilei": "https://upload.wikimedia.org/wikipedia/commons/d/d4/Justus_Sustermans_-_Portrait_of_Galileo_Galilei%2C_1636.jpg",
      "Marie Curie": "https://upload.wikimedia.org/wikipedia/commons/c/c8/Marie_Curie_c._1920s.jpg",
      "Pythagoras": "https://upload.wikimedia.org/wikipedia/commons/1/1a/Kapital_Pythagoras_Louvre_G163.jpg",
      "Euclid": "https://upload.wikimedia.org/wikipedia/commons/3/30/Euklid-von-Alexandria_1.jpg",
      "René Descartes": "https://upload.wikimedia.org/wikipedia/commons/7/73/Frans_Hals_-_Portret_van_Ren%C3%A9_Descartes.jpg",
      "Jose Rizal": "https://upload.wikimedia.org/wikipedia/commons/b/b0/Jose_Rizal_full_length.jpg",
      "Andres Bonifacio": "https://upload.wikimedia.org/wikipedia/commons/2/23/Andres_Bonifacio_studio_portrait.jpg",
      "Apolinario Mabini": "https://upload.wikimedia.org/wikipedia/commons/4/4e/Apolinario_Mabini_seated.jpg",
      "Melchora Aquino": "https://upload.wikimedia.org/wikipedia/commons/a/a2/Melchora_Aquino_portrait.jpg",
      "Lope K. Santos": "https://upload.wikimedia.org/wikipedia/commons/e/e0/Lope_K._Santos.jpg",
      "Karl Popper": "https://upload.wikimedia.org/wikipedia/commons/4/43/Karl_Popper.jpg",
      "John Locke": "https://upload.wikimedia.org/wikipedia/commons/b/b8/John_Locke_by_Herman_Verelst.jpg",
      "Plato": "https://upload.wikimedia.org/wikipedia/commons/8/88/Plato_Silanion_Musei_Capitolini_MC1377.jpg",
      "Aristotle": "https://upload.wikimedia.org/wikipedia/commons/a/ae/Aristotle_Altemps_Inv8575.jpg",
      "Luca Pacioli": "https://upload.wikimedia.org/wikipedia/commons/2/2a/Ritratto_di_Luca_Pacioli.jpg",
      "Adam Smith": "https://upload.wikimedia.org/wikipedia/commons/a/a4/AdamSmith.jpg",
      "Frederick Taylor": "https://upload.wikimedia.org/wikipedia/commons/9/91/Frederick_Winslow_Taylor_crop.jpg",
      "William Ouchi": "https://upload.wikimedia.org/wikipedia/commons/7/7e/App_icon_author_placeholder.png",
      "Abraham Maslow": "https://upload.wikimedia.org/wikipedia/commons/6/6b/Abraham_Maslow.jpg",
      "Arnold Toynbee": "https://upload.wikimedia.org/wikipedia/commons/e/ea/Arnold_J._Toynbee.jpg",
      "Virgilio Enriquez": "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_placeholder.png"
    };

    const authorsPool = {
      science: ["Albert Einstein", "Isaac Newton", "Charles Darwin", "Galileo Galilei", "Marie Curie"],
      math: ["Pythagoras", "Euclid", "René Descartes", "Isaac Newton"],
      filipino: ["Jose Rizal", "Lope K. Santos", "Andres Bonifacio"],
      research: ["Karl Popper", "John Creswell"],
      humanities: ["Plato", "Aristotle", "John Locke", "Virgilio Enriquez"],
      accountancy: ["William Ouchi", "Luca Pacioli", "Adam Smith", "Frederick Taylor", "Abraham Maslow"],
      history: ["Jose Rizal", "Andres Bonifacio", "Apolinario Mabini", "Melchora Aquino", "Arnold Toynbee"]
    };

    const baseData = {
      science: [
        { word: "Theory of Relativity", eng: "Theory of Relativity", author: "Albert Einstein", def: "Teorya ng ugnayan ng espasyo, oras, at grabidad.", background: "Nai-publish noong 1905 at 1915, binago nito ang pag-unawa sa pisika sa pamamagitan ng pagpapatunay na ang oras at espasyo ay hindi absolute kundi nakadepende sa bilis ng observer.", tag: "Teorya" },
        { word: "Laws of Motion", eng: "Laws of Motion", author: "Isaac Newton", def: "Tatlong batas na nagpapaliwanag ng paggalaw ng mga bagay.", background: "Isinulat sa Principia Mathematica (1687), ang tatlong batas na ito (Inertia, F=ma, Action-Reaction) ang naging pundasyon ng Classical Mechanics.", tag: "Teorya" }
      ],
      math: [
        { word: "Pythagorean Theorem", eng: "Pythagorean Theorem", author: "Pythagoras", def: "Pormula para sa mga gilid ng tamang tatsulok ($a^2 + b^2 = c^2$).", background: "Nagmula sa Sinaunang Gresya, ito ang batayan ng Trigonometry at Euclidean Geometry na ginagamit sa arkitektura at nabigasyon.", tag: "Sukat" }
      ],
      filipino: [
        { word: "Balarila ng Wikang Pambansa", eng: "Grammar of National Language", author: "Lope K. Santos", def: "Unang komprehensibong balarila para sa wikang Tagalog/Filipino.", background: "Inilabas noong 1940, binuo nito ang Abakada at ang pormal na tuntunin sa grammar na naging batayan ng pagtuturo ng Filipino sa buong bansa.", tag: "Teorya" }
      ],
      research: [
        { word: "Falsifiability Criterion", eng: "Falsifiability Criterion", author: "Karl Popper", def: "Prinsipyo na ang isang teorya ay dapat pwedeng masubukan at mapatunayang mali.", background: "Iminungkahi ni Popper upang ibukod ang tunay na agham mula sa pseudoscience. Ang isang pahayag ay siyentipiko lamang kung may paraan upang ito ay subukin.", tag: "Teorya" }
      ],
      humanities: [
        { word: "Sikolohiyang Pilipino", eng: "Filipino Psychology", author: "Virgilio Enriquez", def: "Pag-aaral sa diwa, karanasan, at oryentasyong Pilipino.", background: "Isinulong noong dekada '70 bilang reaksyon sa Western Psychology, binibigyang-diin nito ang mga katutubong konsepto tulad ng 'Kapwa' at 'Pakikiramdam'.", tag: "Teorya" }
      ],
      accountancy: [
        { word: "Theory Z", eng: "Theory Z Management", author: "William Ouchi", def: "Teorya sa pamamahala na nakatuon sa job security, loyalty, at pakikilahok ng manggagawa.", background: "Binuo noong 1981 batay sa paghahambing ng Japanese at American management practices. Pinaniniwalaan nito na ang mataas na moral ng manggagawa ay nagmumula sa tiwala at establisadong kultura sa kumpanya.", tag: "Teorya" },
        { word: "Scientific Management", eng: "Scientific Management Theory", author: "Frederick Taylor", def: "Pagsusuri sa daloy ng trabaho upang mapataas ang produktibidad.", background: "Isinulat noong 1911, ang Taylorism ay gumamit ng stopwatch at time-motion studies upang ayusin ang bawat galaw ng manggagawa sa pabrika.", tag: "Teorya" }
      ],
      history: [
        { word: "Kartilya ng Katipunan", eng: "Katipunan Code of Ethics", author: "Andres Bonifacio", def: "Mga aral at prinsipyo ng pamumuhay at pakikibaka ng mga Katipunero.", background: "Isinulat upang maging gabay sa moralidad at disiplina ng mga kasapi ng Katipunan sa pakikipaglaban para sa kalayaan.", tag: "Teorya" },
        { word: "Challenge and Response Theory", eng: "Challenge and Response Theory", author: "Arnold Toynbee", def: "Teorya ukol sa pag-usbong at pagbagsak ng kabihasnan batay sa pagtugon sa pagsubok.", background: "Inilahad sa 'A Study of History', pinaniniwalaan na ang mga sibilisasyon ay umaunlad kapag matagumpay nilang nasasagot ang mga hamon ng kalikasan at lipunan.", tag: "Teorya" }
      ]
    };

    const vocabularyData = {};
    const categories = ["Proseso", "Konsepto", "Elemento", "Teorya", "Pinansyal", "Sukat"];

    Object.keys(baseData).forEach(sector => {
      vocabularyData[sector] = [...baseData[sector]];
      const targetWords = 1000;

      for (let i = vocabularyData[sector].length + 1; i <= targetWords; i++) {
        let tag = categories[i % categories.length];
        let authorIndex = i % 500;
        let baseAuthor = authorsPool[sector][i % authorsPool[sector].length];
        let authorName = baseAuthor + ` (Author #${authorIndex + 1})`;

        vocabularyData[sector].push({
          word: `${sector.charAt(0).toUpperCase() + sector.slice(1)} Aralin/Teorya #${i}`,
          eng: `${sector.toUpperCase()} Academic Term #${i}`,
          author: authorName,
          baseAuthor: baseAuthor,
          def: `Akademikong depinisyon at teorya para sa modyul #${i} na pinangunahan ni ${authorName}.`,
          background: `Ito ang pinalawak na background study para sa modyul #${i}. Tinatalakay rito ang historikal na konteksto at mga aplikasyon ng teorya sa totoong buhay.`,
          tag: tag
        });
      }
    });

    let currentSector = "science";
    let currentPage = 1;
    const itemsPerPage = 50;
    let filteredList = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    function updateStats() {
      let totalWords = 0;
      Object.keys(vocabularyData).forEach(s => totalWords += vocabularyData[s].length);
      document.getElementById('total-words-count').innerText = totalWords.toLocaleString();
      document.getElementById('total-authors-count').innerText = "3,500";
    }

    function switchSector(sector) {
      currentSector = sector;
      document.body.className = `theme-${sector}`;
      document.querySelectorAll('.sector-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('search-input').value = "";
      currentPage = 1;
      filterWords();
      resetQuiz();
    }

    function showSectorBackground() {
      document.getElementById('modal-title').innerText = `Background Study: Sektor ng ${currentSector.toUpperCase()}`;
      document.getElementById('modal-body').innerHTML = `<p style="font-size: 1.05rem; line-height: 1.6;">${sectorBackgrounds[currentSector]}</p>`;
      document.getElementById('info-modal').style.display = 'flex';
    }

    function openWordModal(word, author, def, background) {
      document.getElementById('modal-title').innerText = word;
      document.getElementById('modal-body').innerHTML = `
        <p><strong>👤 Proponent / Author:</strong> ${author}</p>
        <p><strong>📝 Batayang Depinisyon:</strong> ${def}</p>
        <hr>
        <p style="font-size: 1rem; line-height: 1.6;"><strong>📚 Background Study & Context:</strong><br>${background}</p>
      `;
      document.getElementById('info-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('info-modal').style.display = 'none';
    }

    function setMode(mode) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      if (mode === 'vocab') {
        document.getElementById('btn-vocab').classList.add('active');
        document.getElementById('vocab-view').style.display = 'grid';
        document.getElementById('pagination-view').style.display = 'flex';
        document.getElementById('quiz-view').style.display = 'none';
      } else {
        document.getElementById('btn-quiz').classList.add('active');
        document.getElementById('vocab-view').style.display = 'none';
        document.getElementById('pagination-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        loadQuizQuestion();
      }
    }

    function filterWords() {
      const query = document.getElementById('search-input').value.toLowerCase();
      filteredList = vocabularyData[currentSector].filter(item => 
        item.word.toLowerCase().includes(query) || 
        item.eng.toLowerCase().includes(query) ||
        item.author.toLowerCase().includes(query) ||
        item.def.toLowerCase().includes(query)
      );
      currentPage = 1;
      renderVocab();
    }

    function renderVocab() {
      const container = document.getElementById('vocab-view');
      container.innerHTML = "";

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedItems = filteredList.slice(start, end);

      paginatedItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'vocab-card';
        card.onclick = () => openWordModal(item.word, item.author, item.def, item.background);
        
        let tagClass = "tag-konsepto";
        if (item.tag === "Proseso") tagClass = "tag-proseso";
        if (item.tag === "Elemento") tagClass = "tag-elemento";
        if (item.tag === "Teorya") tagClass = "tag-teorya";
        if (item.tag === "Pinansyal") tagClass = "tag-pinansyal";
        if (item.tag === "Sukat") tagClass = "tag-sukat";

        let authorKey = item.baseAuthor || item.author.split(' (')[0];
        let imgUrl = realAuthorImages[authorKey] || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(authorKey)}`;

        card.innerHTML = `
          <div>
            <img src="${imgUrl}" alt="${item.author}" class="card-img" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=Author'">
            <div class="word-header">
              <span class="word-title">${item.word}</span>
              <span class="tag-badge ${tagClass}">${item.tag}</span>
            </div>
            <div class="eng-trans">English: ${item.eng}</div>
            <div class="author-box">👤 Proponent: ${item.author}</div>
            <div class="definition">${item.def}</div>
            <div class="click-hint">🔍 I-click para sa Background Study</div>
          </div>
        `;
        container.appendChild(card);
      });

      const totalPages = Math.ceil(filteredList.length / itemsPerPage) || 1;
      document.getElementById('page-info').innerText = `Pahina ${currentPage} ng ${totalPages}`;
      document.getElementById('prev-page').disabled = currentPage === 1;
      document.getElementById('next-page').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      currentPage += direction;
      renderVocab();
      window.scrollTo({ top: 150, behavior: 'smooth' });
    }

    function loadQuizQuestion() {
      const list = vocabularyData[currentSector];
      if (currentQuizIndex >= 20) {
        document.getElementById('quiz-question').innerText = "Natapos mo na ang Quiz Set!";
        document.getElementById('quiz-options').innerHTML = "";
        document.getElementById('quiz-feedback').innerText = `Kabuuan mong Iskor: ${quizScore} / 20`;
        return;
      }

      const currentItem = list[currentQuizIndex];
      document.getElementById('quiz-question').innerText = `[${currentQuizIndex + 1}/20] Sino ang proponent o ano ang ibig sabihin ng "${currentItem.word}"?`;
      
      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = "";

      let choices = [`${currentItem.def} (Proponent: ${currentItem.author})`];
      while (choices.length < 3) {
        let randomItem = list[Math.floor(Math.random() * list.length)];
        let choiceText = `${randomItem.def} (Proponent: ${randomItem.author})`;
        if (!choices.includes(choiceText)) {
          choices.push(choiceText);
        }
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = choice;
        btn.onclick = () => checkAnswer(choice, choices[0]);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      if (selected === correct) {
        quizScore++;
        alert("Tama! 🎉");
      } else {
        alert("Mali. Ang tamang sagot ay:\n" + correct);
      }
      currentQuizIndex++;
      loadQuizQuestion();
    }

    function resetQuiz() {
      currentQuizIndex = 0;
      quizScore = 0;
      document.getElementById('quiz-feedback').innerText = "";
      if (document.getElementById('quiz-view').style.display === 'block') {
        loadQuizQuestion();
      }
    }

    // Initialize Page
    updateStats();
    filterWords();
  </script>
</body>
</html>
