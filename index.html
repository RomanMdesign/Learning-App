<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aklat at Brochure: May-Akda at Bukabolaryo</title>
  <style>
    :root {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --text-color: #2b2b2b;
      --primary-color: #3e2723;
      --border-color: #d7ccc8;
      --highlight-color: #d84315;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
    }

    body.theme-science { --primary-color: #1b5e20; --highlight-color: #2e7d32; }
    body.theme-math { --primary-color: #0d47a1; --highlight-color: #1565c0; }
    body.theme-filipino { --primary-color: #bf360c; --highlight-color: #d84315; }
    body.theme-research { --primary-color: #4a148c; --highlight-color: #6a1b9a; }
    body.theme-humanities { --primary-color: #880e4f; --highlight-color: #ad1457; }
    body.theme-accountancy { --primary-color: #004d40; --highlight-color: #00695c; }
    body.theme-history { --primary-color: #e65100; --highlight-color: #f57c00; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.7;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
    }

    h1 { margin-bottom: 5px; color: var(--primary-color); font-size: 2.2rem; }
    .subtitle { font-style: italic; color: #555; }

    /* MODE SWITCHER (HIWALAY NA BROCHURE) */
    .mode-switch-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background: #fff;
      color: var(--primary-color);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .mode-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    /* SECTOR NAVIGATION */
    .sector-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sector-btn {
      padding: 8px 16px;
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      background-color: #fff;
      color: var(--primary-color);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .sector-btn.active, .sector-btn:hover {
      background-color: var(--primary-color);
      color: #fff;
    }

    .controls-panel {
      display: flex;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
    }

    .search-bar {
      padding: 10px 15px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }

    .book-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--primary-color);
      padding: 25px;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    /* AUTHORS BROCHURE STYLES */
    .author-profile {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .author-portrait {
      width: 130px;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .author-details { flex-grow: 1; }
    .author-name { font-size: 1.6rem; color: var(--primary-color); margin: 0 0 5px 0; font-weight: bold; }

    /* HIGHLIGHT FONT PARA SA GINAWA / TEORYA / KABAYANIHAN */
    .highlight-work {
      background-color: #fff3e0;
      color: var(--highlight-color);
      font-weight: bold;
      font-size: 1.1rem;
      padding: 4px 10px;
      border-radius: 4px;
      border-left: 4px solid var(--highlight-color);
      display: inline-block;
      margin: 8px 0;
    }

    /* VOCABULARY BROCHURE STYLES */
    .word-title { font-size: 1.6rem; color: var(--primary-color); margin: 0 0 10px 0; font-weight: bold; }
    .word-category { font-style: italic; color: #666; font-size: 0.95rem; }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
    }

    .page-btn {
      padding: 8px 16px;
      border: 1px solid var(--primary-color);
      background: #fff;
      color: var(--primary-color);
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body class="theme-science">

  <header>
    <h1>📖 Sistema ng hiwalay na Brochure</h1>
    <p class="subtitle">Pumili sa pagitan ng Brochure ng mga May-akda o Brochure ng mga Bokabularyo sa bawat Asignatura.</p>
  </header>

  <!-- PUMILI NG BROCHURE NA NAIS TINGNAN -->
  <div class="mode-switch-container">
    <button class="mode-btn active" id="btn-mode-authors" onclick="switchMode('authors')">👤 Brochure ng mga May-Akda at Bayani</button>
    <button class="mode-btn" id="btn-mode-vocab" onclick="switchMode('vocab')">📚 Brochure ng mga Bukabolaryo at Salita</button>
  </div>

  <!-- SEKTOR NG MGA ASIGNATURA -->
  <div class="sector-nav">
    <button class="sector-btn active" onclick="switchSector('science')">🔬 Science</button>
    <button class="sector-btn" onclick="switchSector('math')">📐 Mathematics</button>
    <button class="sector-btn" onclick="switchSector('research')">📊 Research</button>
    <button class="sector-btn" onclick="switchSector('filipino')">✍️ Filipino</button>
    <button class="sector-btn" onclick="switchSector('accountancy')">📈 Accountancy</button>
    <button class="sector-btn" onclick="switchSector('humanities')">🎨 Humanities</button>
    <button class="sector-btn" onclick="switchSector('history')">📜 History</button>
  </div>

  <div class="controls-panel">
    <input type="text" id="search-input" class="search-bar" placeholder="Maghanap..." oninput="filterData()">
  </div>

  <div id="display-view" class="book-container"></div>

  <div class="pagination-container">
    <button class="page-btn" id="prev-page" onclick="changePage(-1)">Previous Page</button>
    <span id="page-info">Pahina 1</span>
    <button class="page-btn" id="next-page" onclick="changePage(1)">Next Page</button>
  </div>

  <script>
    // Tiyak na larawan para sa may totoong litrato lamang
    const realAuthorImages = {
      "Albert Einstein": "https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg",
      "Isaac Newton": "https://upload.wikimedia.org/wikipedia/commons/3/39/GodfreyKneller-IsaacNewton-1689.jpg",
      "Charles Darwin": "https://upload.wikimedia.org/wikipedia/commons/2/2e/Charles_Darwin_seated_crop.jpg",
      "Galileo Galilei": "https://upload.wikimedia.org/wikipedia/commons/d/d4/Justus_Sustermans_-_Portrait_of_Galileo_Galilei%2C_1636.jpg",
      "Marie Curie": "https://upload.wikimedia.org/wikipedia/commons/c/c8/Marie_Curie_c._1920s.jpg",
      "Pythagoras": "https://upload.wikimedia.org/wikipedia/commons/1/1a/Kapital_Pythagoras_Louvre_G163.jpg",
      "Euclid": "https://upload.wikimedia.org/wikipedia/commons/3/30/Euklid-von-Alexandria_1.jpg",
      "René Descartes": "https://upload.wikimedia.org/wikipedia/commons/7/73/Frans_Hals_-_Portret_van_Ren%C3%A9_Descartes.jpg",
      "Jose Rizal": "https://upload.wikimedia.org/wikipedia/commons/b/b0/Jose_Rizal_full_length.jpg",
      "Andres Bonifacio": "https://upload.wikimedia.org/wikipedia/commons/2/23/Andres_Bonifacio_studio_portrait.jpg",
      "Apolinario Mabini": "https://upload.wikimedia.org/wikipedia/commons/4/4e/Apolinario_Mabini_seated.jpg",
      "Melchora Aquino": "https://upload.wikimedia.org/wikipedia/commons/a/a2/Melchora_Aquino_portrait.jpg",
      "Lope K. Santos": "https://upload.wikimedia.org/wikipedia/commons/e/e0/Lope_K._Santos.jpg",
      "Karl Popper": "https://upload.wikimedia.org/wikipedia/commons/4/43/Karl_Popper.jpg",
      "John Locke": "https://upload.wikimedia.org/wikipedia/commons/b/b8/John_Locke_by_Herman_Verelst.jpg",
      "Plato": "https://upload.wikimedia.org/wikipedia/commons/8/88/Plato_Silanion_Musei_Capitolini_MC1377.jpg",
      "Aristotle": "https://upload.wikimedia.org/wikipedia/commons/a/ae/Aristotle_Altemps_Inv8575.jpg",
      "Luca Pacioli": "https://upload.wikimedia.org/wikipedia/commons/2/2a/Ritratto_di_Luca_Pacioli.jpg",
      "Adam Smith": "https://upload.wikimedia.org/wikipedia/commons/a/a4/AdamSmith.jpg"
    };

    // 1. DATA NG MGA AUTHOR/BAYANI LAMANG (WALANG BUKABOLARYONG SALITA)
    const authorsDatabase = {
      science: [
        { name: "Albert Einstein", role: "Theoretical Physicist", bio: "Isinilang sa Germany noong 1879. Isa sa pinakadakilang siyentipiko sa kasaysayan na nagpabago sa ating pag-unawa sa kalawakan, oras, at enerhiya.", contribution: "Theory of Relativity (E=mc²) at Photoelectric Effect" },
        { name: "Isaac Newton", role: "Mathematician at Physicist", bio: "Isang Ingles na siyentipiko na nagtala ng mga batayang batas ng pisika at nakatuklas sa kalikasan ng grabidad at liwanag.", contribution: "Tatlong Batas ng Paggalaw (Laws of Motion) at Law of Universal Gravitation" },
        { name: "Marie Curie", role: "Physicist at Chemist", bio: "Unang babaeng nanalo ng Nobel Prize at natatanging tao na nanalo sa dalawang magkaibang larangan ng agham (Physics at Chemistry).", contribution: "Pagtuklas sa Radioactivity at mga Elementong Polonium at Radium" }
      ],
      math: [
        { name: "Pythagoras", role: "Sinaunang Matematiko at Pilosopo", bio: "Griyegong matematiko na nagtatag ng paaralang Pythagorean. Naniniwala siya na ang matematika ang batayan ng lahat ng bagay sa mundo.", contribution: "Pythagorean Theorem ($a^2 + b^2 = c^2$)" },
        { name: "Euclid", role: "Ama ng Geometry", bio: "Sinaunang matematikong Griyego mula sa Alexandria na nagsulat ng librong 'Elements' na naging batayan ng pagtuturo ng matematika sa loob ng libo-libong taon.", contribution: "Euclidean Geometry at Axiomatic Method" }
      ],
      research: [
        { name: "Karl Popper", role: "Pilosopo ng Agham", bio: "Austrian-British na pilosopo na nagbigay ng malinaw na pamantayan kung ano ang tunay na siyentipikong metodolohiya.", contribution: "Falsifiability Criterion sa Pananaliksik" }
      ],
      filipino: [
        { name: "Lope K. Santos", role: "Ama ng Balarilang Tagalog", bio: "Tanyag na nobelista, makata, at dalubhasa sa wika mula sa Rizal na nag-ukol ng buhay para sa pambansang wika ng Pilipinas.", contribution: "Pagsulat ng Balarila ng Wikang Pambansa at Pagbuo ng Abakada (1940)" },
        { name: "Jose Rizal", role: "Pambansang Bayani at Manunulat", bio: "Isang doktor, dalubwika, at manunulat na gumamit ng kaniyang panulat upang magmulat sa kaisipan ng mamamayang Pilipino.", contribution: "Pagsulat ng Noli Me Tangere at El Filibusterismo" }
      ],
      accountancy: [
        { name: "Luca Pacioli", role: "Ama ng Accountancy", bio: "Isang Italyanong Franciscan friar at matematiko na matalik na kaibigan ni Leonardo da Vinci.", contribution: "Paglikha at Pag-dokumento ng Double-Entry Bookkeeping System (1494)" }
      ],
      humanities: [
        { name: "John Locke", role: "Pilosopo ng Enlightenment", bio: "Ingles na pilosopo na nagtatag ng empiricism at nakaimpluwensya sa modernong kaisipang pampolitika at karapatang pantao.", contribution: "Social Contract Theory at Konsepto ng Natural Rights (Buhay, Kalayaan, Ari-arian)" }
      ],
      history: [
        { name: "Andres Bonifacio", role: "Supremo ng Katipunan", bio: "Dakilang rebolusyonaryong Pilipino mula sa Tondo na nagtatag ng KKK upang lumaban para sa kalayaan laban sa pananakop ng Espanya.", contribution: "Pagtatag ng KKK at Pagsulat ng Kartilya ng Katipunan" },
        { name: "Apolinario Mabini", role: "Utak ng Rebolusyon", bio: "Kilala bilang Dakilang Paralitiko na naglingkod bilang pangunahing tagapayo sa pampolitikang estruktura ng Unang Republika ng Pilipinas.", contribution: "Pagsulat ng La Revolucion Filipina at Constitutional Program" }
      ]
    };

    // 2. DATA NG MGA BUKABOLARYO AT SALITA LAMANG (HIWALAY SA AUTHOR)
    const vocabularyDatabase = {
      science: [
        { word: "Photosynthesis", def: "Proseso kung saan ang mga halaman ay gumagamit ng sikat ng araw upang gumawa ng pagkain mula sa carbon dioxide at tubig.", usage: "Ginagamit sa Biology upang ipaliwanag ang siklo ng enerhiya sa mga halaman." },
        { word: "Thermodynamics", def: "Sanga ng pisika na nag-aaral sa ugnayan ng init, trabaho, at enerhiya.", usage: "Pangunahing aralin sa Physics at Engineering." }
      ],
      math: [
        { word: "Polynomial", def: "Matematikal na ekspresyon na binubuo ng mga baryabol at coefficient gamit ang adisyon, subtraksyon, at multiplikasyon.", usage: "Ginagamit sa Algebra at Calculus." },
        { word: "Standard Deviation", def: "Sukat ng dami ng baryasyon o pagkalat ng mga value sa isang hanay ng datos.", usage: "Mahalagang termino sa Statistics." }
      ],
      research: [
        { word: "Qualitative Research", def: "Uri ng pananaliksik na nakatutok sa pag-unawa sa karanasan, opinyon, at damdamin ng tao gamit ang hindi numerikong datos.", usage: "Ginagamit sa Social Sciences at Mapanuring Pag-aaral." },
        { word: "Hypothesis", def: "Isang pansamantalang hinala o paliwanag na kailangang subukin sa pamamagitan ng eksperimento.", usage: "Batayang bahagi ng Scientific Method." }
      ],
      filipino: [
        { word: "Mapanuring Pagbasa", def: "Malalim na pagsusuri at pag-unawa sa nilalaman, layunin, at konteksto ng isang teksto.", usage: "Aralin sa Pagbasa at Pagsusuri ng Iba't Ibang Teksto." },
        { word: "Kakayahang Lingguwistiko", def: "Abilidad ng isang tao na makabuo at makaintindi ng maayos na pangungusap batay sa mga tuntunin ng grammar.", usage: "Gamit sa Komunikasyon at Pananaliksik sa Wika." }
      ],
      accountancy: [
        { word: "Assets", def: "Lahat ng ari-arian o resources na pagmamay-ari ng isang negosyo na may pangkabuhayang halaga.", usage: "Ginagamit sa Balance Sheet at Financial Accounting." },
        { word: "Liability", def: "Mga obligasyon o utang ng isang negosyo sa ibang partido na kailangang bayaran.", usage: "Batayang termino sa Bookkeeping at Accounting." }
      ],
      humanities: [
        { word: "Epistemology", def: "Sanga ng pilosopiya na nag-aaral sa pinagmulan, kalikasan, at hangganan ng kaalaman ng tao.", usage: "Aralin sa Pilosopiya at Humanidades." }
      ],
      history: [
        { word: "Sovereignty (Kaprangko / Kasarinlan)", def: "Pinakamataas na kapangyarihan ng isang estado na mamahala sa kaniyang nasasakupan nang walang panghihimasok ng ibang bansa.", usage: "Aralin sa Kasaysayan at Politics." }
      ]
    };

    // Punuin ng tig-1000 items bawat sektor para sa dalawang brochure
    const fullAuthors = {};
    const fullVocab = {};

    Object.keys(authorsDatabase).forEach(sec => {
      fullAuthors[sec] = [...authorsDatabase[sec]];
      for (let i = fullAuthors[sec].length + 1; i <= 1000; i++) {
        fullAuthors[sec].push({
          name: `${sec.toUpperCase()} Author #${i}`,
          role: `Mananaliksik at Proponent sa Sektor ng ${sec.toUpperCase()}`,
          bio: `Siya ay isang dedikadong eksperto na nag-ukol ng panahon sa pag-aaral at pagpapaunlad ng kaalaman sa asignaturang ${sec.toUpperCase()}.`,
          contribution: `Teorya at Pag-aaral sa Modyul #${i}`
        });
      }
    });

    Object.keys(vocabularyDatabase).forEach(sec => {
      fullVocab[sec] = [...vocabularyDatabase[sec]];
      for (let i = fullVocab[sec].length + 1; i <= 1000; i++) {
        fullVocab[sec].push({
          word: `${sec.toUpperCase()} Termino #${i}`,
          def: `Tiyak na akademikong depinisyon para sa terminong #${i} sa asignaturang ${sec.toUpperCase()}.`,
          usage: `Ginagamit bilang batayang salita sa pag-aaral ng Modyul #${i}.`
        });
      }
    });

    // SYSTEM VARIABLES
    let currentMode = "authors"; // 'authors' o 'vocab'
    let currentSector = "science";
    let currentPage = 1;
    const itemsPerPage = 10;
    let filteredList = [];

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-authors').classList.toggle('active', mode === 'authors');
      document.getElementById('btn-mode-vocab').classList.toggle('active', mode === 'vocab');
      document.getElementById('search-input').value = "";
      currentPage = 1;
      filterData();
    }

    function switchSector(sector) {
      currentSector = sector;
      document.body.className = `theme-${sector}`;
      document.querySelectorAll('.sector-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('search-input').value = "";
      currentPage = 1;
      filterData();
    }

    function filterData() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      if (currentMode === 'authors') {
        filteredList = fullAuthors[currentSector].filter(item => 
          item.name.toLowerCase().includes(query) || 
          item.role.toLowerCase().includes(query) ||
          item.contribution.toLowerCase().includes(query)
        );
      } else {
        filteredList = fullVocab[currentSector].filter(item => 
          item.word.toLowerCase().includes(query) || 
          item.def.toLowerCase().includes(query)
        );
      }
      
      currentPage = 1;
      renderBrochure();
    }

    function renderBrochure() {
      const container = document.getElementById('display-view');
      container.innerHTML = "";

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedItems = filteredList.slice(start, end);

      if (currentMode === 'authors') {
        // BROCHURE NG MGA AUTHOR/BAYANI
        paginatedItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'book-card';

          let imgUrl = realAuthorImages[item.name];
          // KUNG WALANG TOTOONG LARAWAN, WALA NG ILALAGAY NA MGA PULANG BOX
          let imageHTML = imgUrl ? `<img src="${imgUrl}" alt="${item.name}" class="author-portrait">` : '';

          card.innerHTML = `
            <div class="author-profile">
              ${imageHTML}
              <div class="author-details">
                <h2 class="author-name">👤 ${item.name}</h2>
                <div style="font-style: italic; color: #555;">${item.role}</div>
                <p><strong>📖 Kaligiran ng Pagkatao / Talambuhay:</strong><br>${item.bio}</p>
                <div><strong>🏆 Naiambag na Teorya / Kabayanihan / Ginawa:</strong></div>
                <div class="highlight-work">${item.contribution}</div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        // BROCHURE NG MGA BUKABOLARYO AT SALITA
        paginatedItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'book-card';

          card.innerHTML = `
            <h2 class="word-title">📌 Salita / Termino: ${item.word}</h2>
            <p><strong>📝 Batayang Depinisyon:</strong><br>${item.def}</p>
            <p><strong>📚 Gamit sa Asignatura / Konteksto:</strong><br>${item.usage}</p>
          `;
          container.appendChild(card);
        });
      }

      const totalPages = Math.ceil(filteredList.length / itemsPerPage) || 1;
      document.getElementById('page-info').innerText = `Pahina ${currentPage} ng ${totalPages}`;
      document.getElementById('prev-page').disabled = currentPage === 1;
      document.getElementById('next-page').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      currentPage += direction;
      renderBrochure();
      window.scrollTo({ top: 100, behavior: 'smooth' });
    }

    // Pagpapatakbo sa simula
    filterData();
  </script>
</body>
</html>
